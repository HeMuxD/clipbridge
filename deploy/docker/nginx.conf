# ClipBridge 反代配置（跑在 Docker 容器内）
# 只做 TLS 终止 + 反代；图片 /f/ 也反代到后端（后端内置了 /f/ 静态服务）。
# 注意：这里反代目标是 Docker 网络里的服务名 clipbridge，不是 127.0.0.1。

upstream clipbridge_backend {
    server clipbridge:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nas.hemu.ink;

    ssl_certificate     /etc/letsencrypt/live/nas.hemu.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nas.hemu.ink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    # WebSocket 长连接
    location /ws/ {
        proxy_pass http://clipbridge_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余所有（含 /api/* 与 /f/ 图片下载）
    location / {
        proxy_pass http://clipbridge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
