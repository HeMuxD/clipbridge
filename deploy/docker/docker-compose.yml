# ClipBridge 服务端编排（单容器：Go 二进制 + Nginx 在同一个镜像里）
#
# ── 用法：只需要本目录的两个文件（.env 与 config.yaml），不需要 clone 整个仓库 ──
#
#   cd deploy/docker
#   cp .env.example .env
#   # 编辑 .env，填三项：
#   #   CLIPBRIDGE_SERVER_NAME      → 你的域名
#   #   CLIPBRIDGE_PUBLIC_BASE_URL  → https://<域名>:8443  （必须带端口）
#   #   CLIPBRIDGE_JWT_SECRET       → openssl rand -hex 32
#
#   docker compose up -d            # 拉镜像起服务（几十秒）
#   docker compose logs -f clipbridge    # 配对码打印在这里
#
# 默认从 GHCR 拉取已发布的多架构镜像（amd64 + arm64），
# 用户不需要装 Go、不需要 clone 仓库、也不用等本地编译。
# 拉不到时才自动降级为本地构建（见下面 build 段的说明）。
#
# 端口说明（家庭宽带 80/443 被运营商封锁）：
#   对外主端口是 8443（HTTPS）。容器里 nginx 监听 8443，宿主机映射到 8443。
#   同一个变量控制两侧，不会出现"容器里改了端口但映射没改"的错配。
#   CLIPBRIDGE_PUBLIC_BASE_URL 必须带上这个端口，否则客户端拿到的图片 URL 打不开。
#
# 证书：
#   Nginx 在容器内读 /certs/fullchain.pem 与 /certs/privkey.pem。
#   用 acme.sh 的 DNS-01 签发后，把证书装进 CLIPBRIDGE_CERT_DIR 指向的目录即可：
#     acme.sh --install-cert -d nas.example.com --ecc \
#       --fullchain-file <CERT_DIR>/fullchain.pem \
#       --key-file       <CERT_DIR>/privkey.pem \
#       --reloadcmd      "docker exec clipbridge nginx -s reload"
#   没有证书时容器不会崩，只是降级为"仅明文 HTTP"，并在日志里给出提示。
#   （也可以让容器自己签发续期，见 .env.example 的证书段落）

services:
  clipbridge:
    # ── 镜像来源 ──
    #
    # image 指向 GHCR 上已发布的镜像。想换版本就改这里（或用 .env 覆盖，见下）。
    # 不带 registry 前缀时 compose 不会去拉，只会本地构建，这是最容易踩的坑。
    image: ${CLIPBRIDGE_IMAGE:-ghcr.io/hemuxd/clipbridge}:${CLIPBRIDGE_VERSION:-0.9.9}

    # pull 优先、build 兜底：
    #   · 镜像已发布  → 直接拉，用户零编译（这是默认路径）
    #   · 镜像拉不到  → 自动本地构建，不会卡死
    # 想强制只用本地构建（改代码调试时）：docker compose up -d --build
    # 想强制只拉不构建：docker compose up -d --pull always
    pull_policy: missing
    build:
      # context 指向本目录而不是仓库根：用户只下载 deploy/docker/ 这几个文件
      # 就能构建，不需要 clone 整个仓库（里面有 Android 源码、体积大且与部署无关）。
      # 代价是本地构建需要 Dockerfile 自己下载源码，见 Dockerfile.standalone 的说明。
      context: .
      dockerfile: Dockerfile.standalone
      args:
        # 版本号必须与上面的 image tag 一致，否则 healthz 里的版本号会对不上
        VERSION: "${CLIPBRIDGE_VERSION:-0.9.9}"
        # 国内构建保留镜像源；海外机器可改为 https://proxy.golang.org,direct
        GOPROXY: "${CLIPBRIDGE_GOPROXY:-https://goproxy.cn,direct}"
        # Alpine 软件包源。apk 默认的 dl-cdn 在国内会卡住构建（见 Dockerfile 说明）。
        # 海外环境在 .env 里设成 https://dl-cdn.alpinelinux.org/alpine 即可。
        ALPINE_MIRROR: "${CLIPBRIDGE_ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}"
        # 本地构建时从哪个地址下载源码。默认官方 tarball；
        # 国内慢就换成镜像，例如 https://ghproxy.net/https://github.com
        CLIPBRIDGE_SOURCE_URL: "${CLIPBRIDGE_SOURCE_URL:-}"

    container_name: clipbridge
    restart: unless-stopped

    ports:
      # HTTPS 主端口。80/443 被封，这里默认 8443。
      - "${CLIPBRIDGE_HTTPS_PORT:-8443}:${CLIPBRIDGE_HTTPS_PORT:-8443}"
      # 明文 HTTP，仅用于局域网调试。不想暴露就注释掉这一行。
      - "${CLIPBRIDGE_HTTP_PORT:-8080}:${CLIPBRIDGE_HTTP_PORT:-8080}"

    environment:
      # 两个端口同时决定 nginx 监听端口与宿主机映射端口，保持一致
      CLIPBRIDGE_HTTPS_PORT: "${CLIPBRIDGE_HTTPS_PORT:-8443}"
      CLIPBRIDGE_HTTP_PORT: "${CLIPBRIDGE_HTTP_PORT:-8080}"

      CLIPBRIDGE_SERVER_NAME: "${CLIPBRIDGE_SERVER_NAME:?请在 .env 中设置 CLIPBRIDGE_SERVER_NAME}"
      CLIPBRIDGE_PUBLIC_BASE_URL: "${CLIPBRIDGE_PUBLIC_BASE_URL:?请在 .env 中设置 CLIPBRIDGE_PUBLIC_BASE_URL（记得带端口）}"
      CLIPBRIDGE_JWT_SECRET: "${CLIPBRIDGE_JWT_SECRET:?请在 .env 中设置 CLIPBRIDGE_JWT_SECRET（openssl rand -hex 32）}"

      # 固定配对码（可选）。填了就永久有效、可多台设备重复使用；
      # 留空则启动时随机生成 8 位码，有效期由 config.yaml 的 auth.pair_code_ttl 决定。
      #
      # ⚠️ 注意 compose 的 environment 是白名单：只在 .env 里定义、不在这里列出来的
      #    变量【不会】进入容器。新增环境变量时两处都要改，否则会静默失效。
      CLIPBRIDGE_PAIR_CODE: "${CLIPBRIDGE_PAIR_CODE:-}"
      CLIPBRIDGE_PAIR_CODE_LENGTH: "${CLIPBRIDGE_PAIR_CODE_LENGTH:-8}"

      # 离线补推窗口（秒）。0 = 不补推（默认）：
      # 同步只对"当前这一次复制/截图"生效，设备离线期间攒下的旧内容一律丢弃。
      # 想容忍几秒网络抖动（重连空档里的内容不丢），改成 60~120。
      CLIPBRIDGE_OFFLINE_REPLAY_SECONDS: "${CLIPBRIDGE_OFFLINE_REPLAY_SECONDS:-0}"

      # ---- 证书：容器内自动签发/续期（可选，见 .env.example 的证书段落）----
      # 设置 DOMAIN 即启用；不设则完全走"宿主机签发 + 挂载 /certs"的老路，行为不变。
      CLIPBRIDGE_ACME_DOMAIN: "${CLIPBRIDGE_ACME_DOMAIN:-}"
      CLIPBRIDGE_ACME_EMAIL: "${CLIPBRIDGE_ACME_EMAIL:-}"
      CLIPBRIDGE_ACME_DNS: "${CLIPBRIDGE_ACME_DNS:-dns_cf}"
      # 调试期设成 1 走 Let's Encrypt 测试环境，避免把生产配额打满
      CLIPBRIDGE_ACME_STAGING: "${CLIPBRIDGE_ACME_STAGING:-0}"
      # 强制 acme.sh 走 IPv4（默认 1）。Docker 默认 bridge 没有 IPv6 出口，
      # 不强制的话容器会先试 IPv6 然后挂到超时，而 acme.sh 的 POST 没有响应超时，
      # 一次丢包就永久卡死。设 0 可关闭。
      CLIPBRIDGE_ACME_IPV4_ONLY: "${CLIPBRIDGE_ACME_IPV4_ONLY:-1}"
      # acme.sh 下载源（默认 jsDelivr；github raw 在部分网络下慢到无法完成）
      CLIPBRIDGE_ACMESH_BASE: "${CLIPBRIDGE_ACMESH_BASE:-}"

      # DNS API 凭据。想避免它出现在 docker inspect 里，就改用下面的
      # CLIPBRIDGE_ACME_ENV_FILE + 挂载文件（.env.example 里有说明）。
      CF_Token: "${CF_Token:-}"
      CLIPBRIDGE_ACME_ENV_FILE: "${CLIPBRIDGE_ACME_ENV_FILE:-}"

    volumes:
      # 数据库与图片必须持久化，否则容器重建会丢历史
      - clipbridge-data:/var/lib/clipbridge
      # TLS 证书目录（只读挂载）。模式 A 用；容器内 ACME 模式（模式 B）不用它，
      # 证书会落在上面的数据卷 /var/lib/clipbridge/certs 里。
      - ${CLIPBRIDGE_CERT_DIR:-./certs}:/certs:ro
      # 服务端配置。该文件不存在时 Docker 会创建同名目录并导致启动失败，
      # 仓库里已内置一份，请勿删除。
      - ./config.yaml:/opt/clipbridge/config.yaml:ro
      # 想用「凭据文件」而不是环境变量传 DNS API Token 时，取消下面这行的注释。
      # 注意：宿主机上该文件不存在时 Docker 会创建同名【目录】，
      # entrypoint 会检测到并给出明确报错（不会静默失败）。
      # 用之前先：cp acme-credentials.example acme-credentials && vi acme-credentials
      # - ./acme-credentials:/acme-credentials:ro

    # 日志轮转，避免长期运行把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 个人使用场景下 1 核 256MB 足够（Go 进程很轻，主要开销是 nginx 的几个 worker）
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

    security_opt:
      - no-new-privileges:true

volumes:
  clipbridge-data:
    driver: local
