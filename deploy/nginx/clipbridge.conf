# ClipBridge Nginx 反向代理配置（宿主机 Nginx + systemd 部署方式）
#
# 如果你用 Docker 部署，不需要这个文件 —— 单镜像里已经自带 Nginx，
# 见 deploy/docker/。这个文件只服务于"不用 Docker、直接跑二进制"的场景。
#
# 职责：
#   1. TLS 终止
#   2. WebSocket 升级（Upgrade / Connection 头透传）
#   3. 上传体积限制与基础限流
#
# ⚠️ 端口：家庭宽带的 80 / 443 通常被运营商封锁，因此对外统一使用 8443。
#    客户端里的服务端地址必须写成 https://<域名>:8443，且服务端配置的
#    public_base_url 也要带端口，否则图片下载 URL 会打不开。
#
# 证书用 acme.sh 的 DNS-01 方式签发（不需要占用 80 端口）：
#   acme.sh --issue --dns dns_cf -d nas.hemu.ink --keylength ec-256
#   acme.sh --install-cert -d nas.hemu.ink --ecc \
#     --fullchain-file /etc/nginx/certs/fullchain.pem \
#     --key-file       /etc/nginx/certs/privkey.pem \
#     --reloadcmd      "systemctl reload nginx"
#
# 放置位置：/etc/nginx/conf.d/clipbridge.conf（或 sites-available + 软链）

# WebSocket 升级所需的 Connection 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 上传限流：每 IP 每分钟 60 次
limit_req_zone $binary_remote_addr zone=clipbridge_upload:10m rate=60r/m;

upstream clipbridge_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name nas.hemu.ink;

    # ---- TLS ----
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 上传体积上限，需与 config.yaml 的 storage.max_file_size 保持一致
    client_max_body_size 20m;

    # ---- 图片下载 ----
    # 默认转发给后端：服务端自身就能提供 /f/（internal/api/server.go 的 handleFile），
    # 不依赖任何进程去读数据目录。
    location /f/ {
        proxy_pass http://clipbridge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 可选：让 Nginx 直接读磁盘，少一跳 Go 进程，性能更好。
    # 启用时把上面的 location /f/ 整块注释掉，并取消下面这段的注释。
    #
    # location /f/ {
    #     alias /var/lib/clipbridge/files/;
    #     expires 7d;
    #     add_header Cache-Control "private, max-age=604800";
    #     # 上传目录里不执行任何脚本，避免被利用
    #     location ~ \.(php|py|sh|pl|rb|cgi)$ {
    #         deny all;
    #     }
    # }

    # ---- WebSocket ----
    location /ws/ {
        proxy_pass http://clipbridge_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接必须关掉缓冲，否则消息会被 Nginx 攒着不发
        proxy_buffering off;
        proxy_cache off;

        # 客户端心跳 30 秒一次，读超时放到 1 小时，避免空闲时被掐断
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # ---- 图片上传 ----
    location /api/upload {
        limit_req zone=clipbridge_upload burst=10 nodelay;

        proxy_pass http://clipbridge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }

    # ---- 其余 API ----
    location / {
        proxy_pass http://clipbridge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # 健康检查不写访问日志，避免刷屏
    location = /healthz {
        access_log off;
        proxy_pass http://clipbridge_backend;
    }
}
