# ClipBridge Nginx 反向代理配置
#
# 职责：
#   1. TLS 终止（证书由 certbot 自动签发与续期）
#   2. WebSocket 升级（Upgrade / Connection 头透传）
#   3. 静态图片服务（直接读磁盘，不走 Go 进程，省资源）
#   4. 上传体积限制与基础限流
#
# 放置位置：/etc/nginx/sites-available/clipbridge
# 启用：ln -s /etc/nginx/sites-available/clipbridge /etc/nginx/sites-enabled/
#
# 首次签发证书：
#   certbot certonly --nginx -d clip.example.com

# WebSocket 升级所需的 Connection 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 上传限流：每 IP 每分钟 60 次
limit_req_zone $binary_remote_addr zone=clipbridge_upload:10m rate=60r/m;

upstream clipbridge_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name clip.example.com;

    # 保留 ACME 挑战路径，否则 certbot 续期会失败
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clip.example.com;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/clip.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clip.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 上传体积上限，需与 config.yaml 的 max_file_size 保持一致
    client_max_body_size 20m;

    # ---- 图片下载 ----
    #
    # 方案 A（默认）：转发给后端进程。
    # 服务端自身就能提供 /f/ 静态文件（internal/api/server.go 的 handleFile），
    # 因此 Nginx 不必直接读磁盘。容器化部署时这一点尤其关键：
    # 数据卷由 Docker 管理，宿主机上的 Nginx 根本看不到那些文件。
    location /f/ {
        proxy_pass http://clipbridge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 方案 B（可选，性能更好）：Nginx 直接读磁盘，绕过 Go 进程。
    # 仅当数据目录以【绑定挂载】方式落在宿主机固定路径上时才可用
    # （systemd 部署天然满足；compose 需要把卷改成
    #   - /var/lib/clipbridge:/var/lib/clipbridge 这种写法）。
    # 启用时请把上面的方案 A 整块注释掉，并取消下面这段的注释。
    #
    # location /f/ {
    #     alias /var/lib/clipbridge/files/;
    #     expires 7d;
    #     add_header Cache-Control "private, max-age=604800";
    #     # 上传目录里不执行任何脚本，避免被利用
    #     location ~ \.(php|py|sh|pl|rb|cgi)$ {
    #         deny all;
    #     }
    # }

    # ---- WebSocket ----
    location /ws/ {
        proxy_pass http://clipbridge_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接必须关掉缓冲，否则消息会被 Nginx 攒着不发
        proxy_buffering off;
        proxy_cache off;

        # 心跳 30 秒一次，读超时设 1 小时，避免空闲时被掐断
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # ---- 图片上传 ----
    location /api/upload {
        limit_req zone=clipbridge_upload burst=10 nodelay;

        proxy_pass http://clipbridge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传需要较长时间，放宽超时
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }

    # ---- 其余 API ----
    location / {
        proxy_pass http://clipbridge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # 健康检查不写访问日志，避免刷屏
    location = /healthz {
        access_log off;
        proxy_pass http://clipbridge_backend;
    }
}
